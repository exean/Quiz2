<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Quiz · Mitspielen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <script src="/bg.js" defer></script>
  <script src="/markdown.js" defer></script>
  <script src="/confetti.js" defer></script>
</head>
<body>
  <div class="container">
    <div id="joinCard" class="card">
      <h1>Mitspielen</h1>
      <label for="pin">Game-PIN</label>
      <input id="pin" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="6-stellig" />
      <label for="name">Dein Name</label>
      <input id="name" type="text" maxlength="20" placeholder="z.B. Anna" />
      <label>Avatar</label>
      <div class="avatar-grid" id="avatarGrid"></div>
      <div class="spaced"><button id="joinBtn">Beitreten</button></div>
      <div id="joinError" class="banner-bad small spaced" hidden></div>
    </div>

    <div id="lobbyCard" class="card center" hidden>
      <img id="lobbyLogo" class="quiz-logo" alt="" hidden />
      <h2>Bereit! 🎉</h2>
      <p class="muted">Hallo <strong id="meName"></strong></p>
      <p class="muted small" id="lobbyQuiz"></p>
      <p class="muted small">Warte bis der Host das Spiel startet ...</p>
      <h3 class="spaced">Mitspieler</h3>
      <div id="playerList"></div>
    </div>

    <div id="questionCard" class="card" hidden>
      <div class="flex-between">
        <span class="muted small" id="qIndex"></span>
        <span class="muted small" id="qTimer"></span>
      </div>
      <h2 id="qText"></h2>
      <img id="qImage" class="question-image" alt="" hidden />
      <div class="timer-bar"><div id="timerBar" style="width:100%"></div></div>
      <div id="qAnswers" class="answer-grid"></div>
      <div id="waitMsg" class="banner-warn spaced small" hidden>Antwort abgeschickt – warte auf die anderen ...</div>
    </div>

    <div id="reviewCard" class="card center" hidden>
      <div id="resultBanner"></div>
      <p class="muted spaced">Dein Punktestand</p>
      <div class="pin" id="myScore">0</div>
      <p class="muted small">Warte auf nächste Frage ...</p>
    </div>

    <div id="endCard" class="card" hidden>
      <h2 class="center">🏆 Endstand</h2>
      <table id="finalBoard"></table>
      <div class="spaced center"><a class="btn" href="/play.html">Neu beitreten</a></div>
    </div>

    <div id="cancelBanner" class="banner-warn spaced" hidden></div>
  </div>

  <div id="connBanner" class="conn-banner bad" hidden>Verbindung verloren – versuche zu reconnecten ...</div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const socket = io({ reconnection: true, reconnectionDelay: 500, reconnectionAttempts: Infinity });
    let currentTimer = null;
    let answered = false;
    let currentDeadline = 0;
    let currentTimeLimit = 0;

    const AVATARS = ['🐱','🐶','🦊','🐼','🐯','🦁','🐸','🐵','🐲','🦄','🐝','🐙','🦀','🦋','🌟','⚡','🔥','🚀','🍀','🎯','🎮','🎨','🎵','💡'];
    const STORAGE_KEY = 'quiz-player-session';

    function readSession() {
      try { return JSON.parse(sessionStorage.getItem(STORAGE_KEY) || 'null'); } catch (_) { return null; }
    }
    function writeSession(data) {
      try { sessionStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (_) {}
    }
    function clearSession() {
      try { sessionStorage.removeItem(STORAGE_KEY); } catch (_) {}
    }

    function show(id) {
      ['joinCard', 'lobbyCard', 'questionCard', 'reviewCard', 'endCard'].forEach((x) => {
        $(x).hidden = (x !== id);
      });
    }

    function setConnBanner(state) {
      const b = $('connBanner');
      if (state === 'lost') {
        b.className = 'conn-banner bad';
        b.textContent = 'Verbindung verloren – versuche zu reconnecten ...';
        b.hidden = false;
      } else if (state === 'reconnected') {
        b.className = 'conn-banner good';
        b.textContent = '✓ Wieder verbunden';
        b.hidden = false;
        setTimeout(() => { b.hidden = true; }, 1500);
      } else {
        b.hidden = true;
      }
    }

    const urlPin = new URLSearchParams(location.search).get('pin');
    if (urlPin) $('pin').value = urlPin;

    function renderAvatars(selected) {
      const grid = $('avatarGrid');
      grid.innerHTML = '';
      AVATARS.forEach((emoji) => {
        const lab = document.createElement('label');
        lab.className = 'avatar-tile';
        const input = document.createElement('input');
        input.type = 'radio';
        input.name = 'avatar';
        input.value = emoji;
        if (emoji === selected) input.checked = true;
        const span = document.createElement('span');
        span.textContent = emoji;
        lab.appendChild(input);
        lab.appendChild(span);
        grid.appendChild(lab);
      });
    }
    renderAvatars(AVATARS[Math.floor(Math.random() * AVATARS.length)]);

    function applyBrand(theme, logo) {
      document.documentElement.dataset.theme = theme || 'default';
      if (logo) {
        $('lobbyLogo').src = logo;
        $('lobbyLogo').hidden = false;
      } else {
        $('lobbyLogo').hidden = true;
      }
    }

    function showError(msg) {
      $('joinError').textContent = msg;
      $('joinError').hidden = false;
    }

    $('joinBtn').onclick = () => {
      const pin = $('pin').value.trim();
      const name = $('name').value.trim();
      const avatarInput = document.querySelector('input[name="avatar"]:checked');
      const avatar = avatarInput ? avatarInput.value : null;
      if (!pin || !name) {
        showError('Bitte PIN und Name eingeben');
        return;
      }
      socket.emit('player:join', { pin, name, avatar }, (resp) => {
        if (resp && resp.error) return showError(resp.error);
        $('meName').textContent = (resp.avatar || '') + ' ' + resp.name;
        applyBrand(resp.theme, resp.logo);
        writeSession({ pin: resp.pin, token: resp.token });
        show('lobbyCard');
      });
    };
    $('name').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('joinBtn').click(); });

    socket.on('connect', () => {
      // Try reconnect with stored session on every (re)connect.
      const sess = readSession();
      if (sess && sess.pin && sess.token) {
        socket.emit('player:join', { pin: sess.pin, token: sess.token }, (resp) => {
          if (resp && resp.ok) {
            $('meName').textContent = (resp.avatar || '') + ' ' + resp.name;
            applyBrand(resp.theme, resp.logo);
            if (resp.reconnected) setConnBanner('reconnected');
            if ($('joinCard').hidden === false) show('lobbyCard');
          } else if (resp && resp.error) {
            // Stale session — drop it.
            clearSession();
          }
        });
      }
    });

    socket.on('lobby:update', (data) => {
      if (data.quizName) $('lobbyQuiz').textContent = 'Quiz: ' + data.quizName;
      applyBrand(data.theme, data.logo);
      const list = $('playerList');
      list.innerHTML = '';
      data.players.forEach((p) => {
        const span = document.createElement('span');
        span.className = 'player-pill';
        if (!p.connected) span.style.opacity = '0.5';
        span.innerHTML = (p.avatar ? '<span class="avatar">' + p.avatar + '</span>' : '') + escapeHtml(p.name);
        list.appendChild(span);
      });
    });

    socket.on('question:start', (data) => {
      answered = false;
      show('questionCard');
      const typeLabel = data.type === 'text' ? ' · Freitext' : data.type === 'slider' ? ' · Schätzung' : '';
      $('qIndex').textContent = 'Frage ' + (data.index + 1) + ' / ' + data.total + typeLabel;
      if (window.setMarkdown) window.setMarkdown($('qText'), data.text);
      else $('qText').textContent = data.text;
      if (data.image) {
        $('qImage').src = data.image;
        $('qImage').hidden = false;
      } else {
        $('qImage').hidden = true;
        $('qImage').removeAttribute('src');
      }
      $('waitMsg').hidden = true;
      const ans = $('qAnswers');
      ans.innerHTML = '';
      if (data.type === 'text') {
        ans.className = '';
        const form = document.createElement('div');
        form.innerHTML =
          '<input id="textAnswerInput" type="text" maxlength="200" placeholder="Deine Antwort..." autocomplete="off" autocapitalize="off" spellcheck="false" />' +
          '<button id="submitTextBtn" class="spaced" style="width:100%">Antwort absenden</button>';
        ans.appendChild(form);
        const input = document.getElementById('textAnswerInput');
        const submitBtn = document.getElementById('submitTextBtn');
        input.focus();
        const submit = () => sendTextAnswer(input.value);
        submitBtn.onclick = submit;
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
      } else if (data.type === 'slider') {
        ans.className = '';
        const min = Number(data.min) || 0;
        const max = Number(data.max) || 100;
        const step = Number(data.step) || 1;
        const unit = data.unit || '';
        const startVal = Math.round((min + max) / 2);
        const wrap = document.createElement('div');
        wrap.className = 'slider-wrap';
        wrap.innerHTML =
          '<div class="slider-value" id="sliderValue">' + startVal + (unit ? '<span class="unit">' + escapeHtml(unit) + '</span>' : '') + '</div>' +
          '<input class="slider-input" id="sliderInput" type="range" min="' + min + '" max="' + max + '" step="' + step + '" value="' + startVal + '" />' +
          '<div class="slider-range"><span>' + min + (unit ? ' ' + escapeHtml(unit) : '') + '</span><span>' + max + (unit ? ' ' + escapeHtml(unit) : '') + '</span></div>' +
          '<button id="submitSliderBtn" style="width:100%;margin-top:.5rem">Antwort absenden</button>';
        ans.appendChild(wrap);
        const input = document.getElementById('sliderInput');
        const valueEl = document.getElementById('sliderValue');
        input.addEventListener('input', () => {
          valueEl.innerHTML = input.value + (unit ? '<span class="unit">' + escapeHtml(unit) + '</span>' : '');
        });
        document.getElementById('submitSliderBtn').onclick = () => sendSliderAnswer(Number(input.value));
      } else {
        ans.className = 'answer-grid' + (data.answers.length <= 2 ? ' cols-1' : '');
        data.answers.forEach((a, i) => {
          const btn = document.createElement('button');
          btn.className = 'answer-btn c' + i;
          btn.textContent = String.fromCharCode(65 + i) + ' · ' + a;
          btn.onclick = () => sendAnswer(i, btn);
          ans.appendChild(btn);
        });
      }
      currentDeadline = data.deadline;
      currentTimeLimit = data.timeLimit;
      runTimer(data.deadline, data.timeLimit);
    });

    socket.on('answer:locked', () => {
      answered = true;
      $('waitMsg').hidden = false;
      $('waitMsg').textContent = 'Du hast bereits geantwortet – warte auf den Host.';
      document.querySelectorAll('#qAnswers .answer-btn, #qAnswers input, #qAnswers button').forEach((b) => { b.disabled = true; });
    });

    function sendAnswer(idx, btn) {
      if (answered) return;
      answered = true;
      document.querySelectorAll('#qAnswers .answer-btn').forEach((b) => {
        b.classList.add('dim');
        b.disabled = true;
      });
      btn.classList.remove('dim');
      btn.classList.add('selected');
      $('waitMsg').hidden = false;
      socket.emit('player:answer', { choice: idx }, (resp) => {
        if (resp && resp.error) {
          answered = false;
          $('waitMsg').hidden = true;
          alert(resp.error);
        }
      });
    }

    function sendTextAnswer(text) {
      if (answered) return;
      const value = (text || '').trim();
      if (!value) {
        alert('Bitte eine Antwort eingeben');
        return;
      }
      answered = true;
      const input = document.getElementById('textAnswerInput');
      const submitBtn = document.getElementById('submitTextBtn');
      if (input) input.disabled = true;
      if (submitBtn) submitBtn.disabled = true;
      $('waitMsg').hidden = false;
      $('waitMsg').textContent = '"' + value + '" abgeschickt – warte auf die anderen ...';
      socket.emit('player:answer', { text: value }, (resp) => {
        if (resp && resp.error) {
          answered = false;
          if (input) input.disabled = false;
          if (submitBtn) submitBtn.disabled = false;
          $('waitMsg').hidden = true;
          alert(resp.error);
        }
      });
    }

    function sendSliderAnswer(val) {
      if (answered) return;
      answered = true;
      const inp = document.getElementById('sliderInput');
      const btn = document.getElementById('submitSliderBtn');
      if (inp) inp.disabled = true;
      if (btn) btn.disabled = true;
      $('waitMsg').hidden = false;
      $('waitMsg').textContent = 'Geschätzt: ' + val + ' – warte auf die anderen ...';
      socket.emit('player:answer', { value: val }, (resp) => {
        if (resp && resp.error) {
          answered = false;
          if (inp) inp.disabled = false;
          if (btn) btn.disabled = false;
          $('waitMsg').hidden = true;
          alert(resp.error);
        }
      });
    }

    socket.on('question:result', (data) => {
      show('reviewCard');
      const banner = $('resultBanner');
      if (data.correct) {
        banner.className = 'banner-good';
        banner.textContent = '✅ Richtig! +' + data.gained + ' Punkte';
        if (window.confetti) window.confetti();
      } else {
        banner.className = 'banner-bad';
        let html = '❌ Leider falsch';
        if (data.type === 'text' && Array.isArray(data.acceptedAnswers) && data.acceptedAnswers.length) {
          html += '<div class="small spaced" style="opacity:.85">Korrekt wäre: ' + data.acceptedAnswers.map((a) => '<strong>' + escapeHtml(a) + '</strong>').join(' / ') + '</div>';
        } else if (data.type === 'slider' && data.correctValue !== null && data.correctValue !== undefined) {
          html += '<div class="small spaced" style="opacity:.85">Korrekt wäre: <strong>' + data.correctValue + (data.sliderUnit ? ' ' + escapeHtml(data.sliderUnit) : '') + '</strong></div>';
        }
        banner.innerHTML = html;
      }
      $('myScore').textContent = data.score;
    });

    socket.on('game:end', (data) => {
      show('endCard');
      clearSession();
      const table = $('finalBoard');
      table.innerHTML = '<thead><tr><th>#</th><th>Spieler</th><th class="score">Punkte</th></tr></thead>';
      const tbody = document.createElement('tbody');
      data.leaderboard.forEach((p, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = '<td class="rank">' + (i + 1) + '</td><td>' +
          (p.avatar ? p.avatar + ' ' : '') + escapeHtml(p.name) +
          '</td><td class="score">' + p.score + '</td>';
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
    });

    socket.on('game:cancelled', (data) => {
      $('cancelBanner').textContent = data.reason || 'Spiel beendet';
      $('cancelBanner').hidden = false;
      clearSession();
    });

    socket.on('disconnect', () => {
      setConnBanner('lost');
    });

    function runTimer(deadline, total) {
      if (currentTimer) clearInterval(currentTimer);
      const bar = $('timerBar');
      const txt = $('qTimer');
      function tick() {
        const left = Math.max(0, deadline - Date.now());
        bar.style.width = (left / (total * 1000) * 100) + '%';
        txt.textContent = Math.ceil(left / 1000) + ' s';
        if (left <= 0) clearInterval(currentTimer);
      }
      tick();
      currentTimer = setInterval(tick, 250);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }
  </script>
</body>
</html>
