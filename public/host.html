<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz · Host</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <script src="/bg.js" defer></script>
</head>
<body>
  <div class="container">
    <div id="startCard" class="card center">
      <h1 id="hostTitle">Spiel starten</h1>
      <p class="muted" id="hostSub">Spiel mit dem ausgewählten Quiz erstellen.</p>
      <button id="createBtn">Spiel erstellen</button>
      <div class="spaced"><a class="btn secondary" href="/dashboard.html">Zurück zum Dashboard</a></div>
      <div id="createError" class="banner-bad small spaced" hidden></div>
    </div>

    <div id="lobbyCard" class="card center" hidden>
      <h2 id="lobbyName"></h2>
      <p class="muted" id="lobbyDesc"></p>
      <div class="join-info">
        <div class="qr-wrap">
          <img id="qrImage" alt="QR-Code zum Beitreten" hidden />
        </div>
        <div class="pin-wrap">
          <p class="muted">Game-PIN</p>
          <div class="pin" id="pinDisplay">------</div>
          <p class="muted small">QR scannen oder<br><strong id="joinUrl">/play.html</strong> öffnen</p>
        </div>
      </div>
      <p class="muted small" id="totalQ"></p>
      <h3 class="spaced">Spieler</h3>
      <div id="playerList"></div>
      <button id="startBtn" class="spaced" disabled>Quiz starten</button>
    </div>

    <div id="questionCard" class="card" hidden>
      <div class="flex-between">
        <span class="muted small" id="qIndex"></span>
        <span class="muted small" id="progress"></span>
      </div>
      <h2 id="qText"></h2>
      <div class="timer-bar"><div id="timerBar" style="width:100%"></div></div>
      <div id="qAnswers" class="answer-grid"></div>
    </div>

    <div id="reviewCard" class="card" hidden>
      <h2 id="reviewTitle">Auflösung</h2>
      <div id="reviewBody"></div>
      <h3 class="spaced">Punktestand</h3>
      <table id="reviewBoard"></table>
      <div class="spaced">
        <button id="nextBtn">Weiter</button>
      </div>
    </div>

    <div id="endCard" class="card" hidden>
      <h2>🏆 Endstand</h2>
      <table id="finalBoard"></table>
      <div class="spaced"><a class="btn" href="/dashboard.html">Zurück zum Dashboard</a></div>
    </div>

    <div id="cancelBanner" class="banner-warn spaced" hidden></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const quizId = params.get('quiz');
    if (!quizId) location.href = '/dashboard.html';

    const socket = io({ withCredentials: true });
    let currentTimer = null;

    function show(id) {
      ['startCard', 'lobbyCard', 'questionCard', 'reviewCard', 'endCard'].forEach((x) => {
        $(x).hidden = (x !== id);
      });
    }

    $('createBtn').onclick = () => {
      socket.emit('host:create', { quizId, origin: location.origin }, (resp) => {
        if (resp && resp.error) {
          $('createError').textContent = resp.error;
          $('createError').hidden = false;
          return;
        }
        $('pinDisplay').textContent = resp.pin;
        const joinUrl = resp.joinUrl || (location.origin + '/play.html?pin=' + resp.pin);
        $('joinUrl').textContent = joinUrl.replace(/^https?:\/\//, '');
        $('totalQ').textContent = resp.totalQuestions + ' Fragen';
        $('lobbyName').textContent = resp.quizName;
        if (resp.qr) {
          $('qrImage').src = resp.qr;
          $('qrImage').hidden = false;
        }
        show('lobbyCard');
      });
    };

    socket.on('lobby:update', (data) => {
      if (data.quizDescription) $('lobbyDesc').textContent = data.quizDescription;
      const list = $('playerList');
      list.innerHTML = '';
      if (!data.players.length) {
        list.innerHTML = '<p class="muted small">Warte auf Spieler ...</p>';
      } else {
        data.players.forEach((p) => {
          const span = document.createElement('span');
          span.className = 'player-pill';
          span.textContent = p.name;
          list.appendChild(span);
        });
      }
      $('startBtn').disabled = data.players.length === 0;
    });

    $('startBtn').onclick = () => {
      socket.emit('host:start', {}, (resp) => {
        if (resp && resp.error) alert(resp.error);
      });
    };

    socket.on('question:start', (data) => {
      show('questionCard');
      $('qIndex').textContent = 'Frage ' + (data.index + 1) + ' von ' + data.total;
      $('progress').textContent = '0 / ' + ($('playerList').children.length || 0) + ' geantwortet';
      $('qText').textContent = data.text;
      const ans = $('qAnswers');
      ans.innerHTML = '';
      ans.className = 'answer-grid' + (data.answers.length <= 2 ? ' cols-1' : '');
      data.answers.forEach((a, i) => {
        const btn = document.createElement('div');
        btn.className = 'answer-btn c' + i;
        btn.textContent = String.fromCharCode(65 + i) + ' · ' + a;
        ans.appendChild(btn);
      });
      runTimer(data.deadline, data.timeLimit);
    });

    socket.on('host:answerProgress', ({ answered, total }) => {
      $('progress').textContent = answered + ' / ' + total + ' geantwortet';
    });

    socket.on('question:end', (data) => {
      if (currentTimer) { clearInterval(currentTimer); currentTimer = null; }
      show('reviewCard');
      const correctCount = data.perPlayer.filter((p) => p.correct).length;
      $('reviewTitle').textContent = correctCount + ' von ' + data.perPlayer.length + ' richtig';
      const body = $('reviewBody');
      body.innerHTML = '';
      const counts = data.counts;
      const max = Math.max(1, ...counts);
      counts.forEach((c, i) => {
        const row = document.createElement('div');
        row.style.margin = '.55rem 0';
        const label = document.createElement('div');
        label.className = 'small';
        label.style.marginBottom = '.3rem';
        label.innerHTML = '<strong>' + String.fromCharCode(65 + i) + '</strong> · ' + c + ' Stimme(n)' + (i === data.correctIndex ? ' ✅' : '');
        if (i === data.correctIndex) label.style.color = 'var(--good)';
        const bar = document.createElement('div');
        bar.style.height = '10px';
        bar.style.borderRadius = '999px';
        bar.style.transition = 'width .6s cubic-bezier(.22,1,.36,1)';
        bar.style.background = i === data.correctIndex
          ? 'linear-gradient(90deg, var(--good), #10b981)'
          : 'linear-gradient(90deg, rgba(255,255,255,.18), rgba(255,255,255,.08))';
        bar.style.width = Math.round((c / max) * 100) + '%';
        bar.style.boxShadow = i === data.correctIndex ? '0 0 12px rgba(52, 211, 153, .5)' : 'none';
        row.appendChild(label); row.appendChild(bar);
        body.appendChild(row);
      });
      renderBoard($('reviewBoard'), data.leaderboard);
      $('nextBtn').textContent = data.hasNext ? 'Nächste Frage' : 'Endstand zeigen';
    });

    $('nextBtn').onclick = () => {
      socket.emit('host:next', {}, (resp) => { if (resp && resp.error) alert(resp.error); });
    };

    socket.on('game:end', (data) => {
      show('endCard');
      renderBoard($('finalBoard'), data.leaderboard);
    });

    socket.on('game:cancelled', (data) => {
      $('cancelBanner').textContent = data.reason || 'Spiel beendet';
      $('cancelBanner').hidden = false;
    });

    socket.on('disconnect', () => {
      $('cancelBanner').textContent = 'Verbindung verloren. Bitte Seite neu laden.';
      $('cancelBanner').hidden = false;
    });

    function renderBoard(table, board) {
      table.innerHTML = '<thead><tr><th>#</th><th>Spieler</th><th class="score">Punkte</th></tr></thead>';
      const tbody = document.createElement('tbody');
      board.forEach((p, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = '<td class="rank">' + (i + 1) + '</td><td>' + escapeHtml(p.name) + '</td><td class="score">' + p.score + '</td>';
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
    }

    function runTimer(deadline, total) {
      if (currentTimer) clearInterval(currentTimer);
      const bar = $('timerBar');
      function tick() {
        const left = Math.max(0, deadline - Date.now());
        bar.style.width = (left / (total * 1000) * 100) + '%';
        if (left <= 0) clearInterval(currentTimer);
      }
      tick();
      currentTimer = setInterval(tick, 250);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
  </script>
</body>
</html>
