<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz · Host</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <script>
    // Apply theme synchronously before paint, if the dashboard passed it.
    (function () {
      var t = new URLSearchParams(location.search).get('theme');
      if (t && /^[a-z-]+$/.test(t)) document.documentElement.dataset.theme = t;
    })();
  </script>
  <script src="/bg.js" defer></script>
  <script src="/markdown.js" defer></script>
</head>
<body>
  <div class="container">
    <div id="startCard" class="card center">
      <p class="muted">Spiel wird erstellt ...</p>
      <div id="createError" class="banner-bad small spaced" hidden></div>
      <div id="retryWrap" class="spaced" hidden>
        <button id="createBtn">Erneut versuchen</button>
        <a class="btn secondary spaced" href="/dashboard.html">Zurück</a>
      </div>
    </div>

    <div id="lobbyCard" class="card center" hidden>
      <img id="lobbyLogo" class="quiz-logo" alt="" hidden />
      <h2 id="lobbyName"></h2>
      <p class="muted" id="lobbyDesc"></p>
      <div class="join-info">
        <div class="qr-wrap">
          <img id="qrImage" alt="QR-Code zum Beitreten" hidden />
        </div>
        <div class="pin-wrap">
          <p class="muted">Game-PIN</p>
          <div class="pin" id="pinDisplay">------</div>
          <p class="muted small">QR scannen oder<br><strong id="joinUrl">/play.html</strong> öffnen</p>
          <div class="row spaced" style="justify-content:center">
            <button id="shareBtn" type="button" class="secondary" style="padding:.55rem 1.1rem">📤 Teilen</button>
            <button id="copyBtn" type="button" class="secondary" style="padding:.55rem 1.1rem">📋 Link</button>
          </div>
          <div id="shareMsg" class="muted small" style="margin-top:.35rem;min-height:1.2em"></div>
        </div>
      </div>
      <p class="muted small" id="totalQ"></p>
      <h3 class="spaced">Spieler</h3>
      <div id="playerList"></div>
      <button id="startBtn" class="spaced" disabled>Quiz starten</button>
    </div>

    <div id="questionCard" class="card" hidden>
      <div class="flex-between">
        <span class="muted small" id="qIndex"></span>
        <span class="muted small" id="progress"></span>
      </div>
      <h2 id="qText"></h2>
      <img id="qImage" class="question-image" alt="" hidden />
      <div class="timer-bar"><div id="timerBar" style="width:100%"></div></div>
      <div id="qAnswers" class="answer-grid"></div>
    </div>

    <div id="reviewCard" class="card" hidden>
      <h2 id="reviewTitle">Auflösung</h2>
      <div id="reviewBody"></div>
      <h3 class="spaced">Punktestand</h3>
      <table id="reviewBoard"></table>
      <div class="spaced">
        <button id="nextBtn">Weiter</button>
      </div>
    </div>

    <div id="endCard" class="card" hidden>
      <h2>🏆 Endstand</h2>
      <table id="finalBoard"></table>
      <div class="spaced"><a class="btn" href="/dashboard.html">Zurück zum Dashboard</a></div>
    </div>

    <div id="cancelBanner" class="banner-warn spaced" hidden></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const quizId = params.get('quiz');
    if (!quizId) location.href = '/dashboard.html';

    const socket = io({ withCredentials: true });
    let currentTimer = null;
    let currentJoinUrl = '';
    let currentPin = '';
    let currentQuizName = '';
    let gameCreated = false;

    function show(id) {
      ['startCard', 'lobbyCard', 'questionCard', 'reviewCard', 'endCard'].forEach((x) => {
        $(x).hidden = (x !== id);
      });
    }

    function applyBrand(theme, logo) {
      if (theme) document.documentElement.dataset.theme = theme;
      if (logo) {
        $('lobbyLogo').src = logo;
        $('lobbyLogo').hidden = false;
      } else {
        $('lobbyLogo').hidden = true;
      }
    }

    function createGame() {
      $('createError').hidden = true;
      $('retryWrap').hidden = true;
      socket.emit('host:create', { quizId, origin: location.origin }, (resp) => {
        if (resp && resp.error) {
          $('createError').textContent = resp.error;
          $('createError').hidden = false;
          $('retryWrap').hidden = false;
          return;
        }
        gameCreated = true;
        currentPin = resp.pin;
        currentJoinUrl = resp.joinUrl || (location.origin + '/play.html?pin=' + resp.pin);
        currentQuizName = resp.quizName;
        $('pinDisplay').textContent = resp.pin;
        $('joinUrl').textContent = currentJoinUrl.replace(/^https?:\/\//, '');
        $('totalQ').textContent = resp.totalQuestions + ' Fragen';
        $('lobbyName').textContent = resp.quizName;
        applyBrand(resp.theme, resp.logo);
        if (resp.qr) {
          $('qrImage').src = resp.qr;
          $('qrImage').hidden = false;
        }
        show('lobbyCard');
      });
    }
    $('createBtn').onclick = createGame;

    // Auto-start as soon as we're connected.
    socket.on('connect', () => {
      if (!gameCreated) createGame();
    });

    function flashShareMsg(text) {
      $('shareMsg').textContent = text;
      clearTimeout(flashShareMsg._t);
      flashShareMsg._t = setTimeout(() => { $('shareMsg').textContent = ''; }, 2000);
    }

    $('shareBtn').onclick = async () => {
      const shareData = {
        title: 'Quiz: ' + currentQuizName,
        text: 'Mach mit bei "' + currentQuizName + '" – PIN ' + currentPin,
        url: currentJoinUrl,
      };
      if (navigator.share) {
        try { await navigator.share(shareData); flashShareMsg('✓ Geteilt'); }
        catch (err) { if (err && err.name !== 'AbortError') flashShareMsg('Teilen fehlgeschlagen'); }
      } else {
        // Fallback: copy
        try {
          await navigator.clipboard.writeText(shareData.text + '\n' + shareData.url);
          flashShareMsg('Link kopiert');
        } catch (_) {
          flashShareMsg('Teilen wird vom Browser nicht unterstützt');
        }
      }
    };

    $('copyBtn').onclick = async () => {
      try {
        await navigator.clipboard.writeText(currentJoinUrl);
        flashShareMsg('✓ Link kopiert');
      } catch (_) {
        flashShareMsg('Kopieren fehlgeschlagen');
      }
    };

    socket.on('lobby:update', (data) => {
      if (data.quizDescription) {
        if (window.setMarkdown) window.setMarkdown($('lobbyDesc'), data.quizDescription);
        else $('lobbyDesc').textContent = data.quizDescription;
      }
      applyBrand(data.theme, data.logo);
      const list = $('playerList');
      list.innerHTML = '';
      const connected = data.players.filter((p) => p.connected !== false);
      if (!connected.length) {
        list.innerHTML = '<p class="muted small">Warte auf Spieler ...</p>';
      } else {
        connected.forEach((p) => {
          const span = document.createElement('span');
          span.className = 'player-pill';
          span.innerHTML = (p.avatar ? '<span class="avatar">' + p.avatar + '</span>' : '') + escapeHtml(p.name);
          list.appendChild(span);
        });
      }
      $('startBtn').disabled = connected.length === 0;
    });

    $('startBtn').onclick = () => {
      socket.emit('host:start', {}, (resp) => {
        if (resp && resp.error) alert(resp.error);
      });
    };

    socket.on('question:start', (data) => {
      show('questionCard');
      const typeLabel = data.type === 'text' ? ' · Freitext' : data.type === 'slider' ? ' · Schätzung' : '';
      $('qIndex').textContent = 'Frage ' + (data.index + 1) + ' von ' + data.total + typeLabel;
      $('progress').textContent = '0 / ' + ($('playerList').children.length || 0) + ' geantwortet';
      if (window.setMarkdown) window.setMarkdown($('qText'), data.text);
      else $('qText').textContent = data.text;
      if (data.image) {
        $('qImage').src = data.image;
        $('qImage').hidden = false;
      } else {
        $('qImage').hidden = true;
        $('qImage').removeAttribute('src');
      }
      const ans = $('qAnswers');
      ans.innerHTML = '';
      if (data.type === 'text') {
        ans.className = '';
        const info = document.createElement('div');
        info.className = 'banner-warn center';
        info.style.padding = '1.5rem 1rem';
        info.style.fontSize = '1.05rem';
        info.innerHTML = '⌨ Spieler tippen ihre Antwort auf dem Smartphone. <br><span class="muted small">Zeit: ' + data.timeLimit + 's</span>';
        ans.appendChild(info);
      } else if (data.type === 'slider') {
        ans.className = '';
        const info = document.createElement('div');
        info.className = 'banner-warn center';
        info.style.padding = '1.5rem 1rem';
        info.style.fontSize = '1.05rem';
        const unit = data.unit ? ' ' + data.unit : '';
        info.innerHTML = '🎚 Spieler schätzen einen Wert zwischen <strong>' + data.min + unit + '</strong> und <strong>' + data.max + unit + '</strong>.<br><span class="muted small">Zeit: ' + data.timeLimit + 's</span>';
        ans.appendChild(info);
      } else {
        ans.className = 'answer-grid' + (data.answers.length <= 2 ? ' cols-1' : '');
        data.answers.forEach((a, i) => {
          const btn = document.createElement('div');
          btn.className = 'answer-btn c' + i;
          btn.textContent = String.fromCharCode(65 + i) + ' · ' + a;
          ans.appendChild(btn);
        });
      }
      window.__currentAnswers = data.answers || null;
      runTimer(data.deadline, data.timeLimit);
    });

    socket.on('host:answerProgress', ({ answered, total }) => {
      $('progress').textContent = answered + ' / ' + total + ' geantwortet';
    });

    socket.on('question:end', (data) => {
      if (currentTimer) { clearInterval(currentTimer); currentTimer = null; }
      show('reviewCard');
      const correctCount = data.perPlayer.filter((p) => p.correct).length;
      $('reviewTitle').textContent = correctCount + ' von ' + data.perPlayer.length + ' richtig';
      const body = $('reviewBody');
      body.innerHTML = '';

      if (data.type === 'slider') {
        const unit = data.sliderUnit ? ' ' + data.sliderUnit : '';
        const accepted = document.createElement('div');
        accepted.style.marginBottom = '.8rem';
        accepted.innerHTML = '<div class="small muted" style="margin-bottom:.3rem">Korrekter Wert</div>' +
          '<div style="display:inline-block;padding:.45rem .9rem;border-radius:999px;background:rgba(52,211,153,.15);border:1px solid rgba(52,211,153,.35);color:var(--good);font-weight:700">' +
          data.correctValue + unit +
          (data.tolerance ? ' <span class="muted small" style="font-weight:500">(± ' + data.tolerance + unit + ')</span>' : '') +
          '</div>';
        body.appendChild(accepted);
        const list = document.createElement('div');
        list.innerHTML = '<div class="small muted" style="margin:.6rem 0 .3rem">Schätzungen</div>';
        const sorted = (data.perPlayer || []).slice().sort((a, b) => {
          const av = a.value === null || a.value === undefined ? Infinity : Math.abs(a.value - data.correctValue);
          const bv = b.value === null || b.value === undefined ? Infinity : Math.abs(b.value - data.correctValue);
          return av - bv;
        });
        sorted.forEach((p) => {
          const row = document.createElement('div');
          row.style.display = 'flex';
          row.style.justifyContent = 'space-between';
          row.style.gap = '.5rem';
          row.style.padding = '.35rem 0';
          row.style.borderBottom = '1px solid var(--border)';
          const ans = (p.value !== null && p.value !== undefined) ? (p.value + unit) : '— keine —';
          row.innerHTML =
            '<div>' + (p.avatar ? p.avatar + ' ' : '') + '<strong>' + escapeHtml(p.name) + '</strong> <span class="muted small">' + escapeHtml(ans) + '</span></div>' +
            '<div style="color:' + (p.correct ? 'var(--good)' : 'var(--bad)') + '">' + (p.correct ? '✓ +' + p.gained : '✗') + '</div>';
          list.appendChild(row);
        });
        body.appendChild(list);
      } else if (data.type === 'text') {
        // Accepted answers
        const accepted = document.createElement('div');
        accepted.style.marginBottom = '.8rem';
        accepted.innerHTML = '<div class="small muted" style="margin-bottom:.3rem">Akzeptierte Antworten</div>';
        (data.acceptedAnswers || []).forEach((a) => {
          const tag = document.createElement('span');
          tag.style.display = 'inline-block';
          tag.style.padding = '.35rem .7rem';
          tag.style.margin = '.2rem .25rem .2rem 0';
          tag.style.borderRadius = '999px';
          tag.style.background = 'rgba(52, 211, 153, .15)';
          tag.style.border = '1px solid rgba(52, 211, 153, .35)';
          tag.style.color = 'var(--good)';
          tag.style.fontWeight = '600';
          tag.textContent = a;
          accepted.appendChild(tag);
        });
        body.appendChild(accepted);

        // Player responses
        const list = document.createElement('div');
        list.innerHTML = '<div class="small muted" style="margin:.6rem 0 .3rem">Spieler-Antworten</div>';
        data.perPlayer.forEach((p) => {
          const row = document.createElement('div');
          row.style.display = 'flex';
          row.style.justifyContent = 'space-between';
          row.style.gap = '.5rem';
          row.style.padding = '.35rem 0';
          row.style.borderBottom = '1px solid var(--border)';
          const text = p.text ? p.text : '— keine Antwort —';
          row.innerHTML =
            '<div>' + (p.avatar ? p.avatar + ' ' : '') + '<strong>' + escapeHtml(p.name) + '</strong> <span class="muted small">' + escapeHtml(text) + '</span></div>' +
            '<div style="color:' + (p.correct ? 'var(--good)' : 'var(--bad)') + '">' + (p.correct ? '✓ +' + p.gained : '✗') + '</div>';
          list.appendChild(row);
        });
        body.appendChild(list);
      } else {
        const counts = data.counts || [];
        const max = Math.max(1, ...counts);
        counts.forEach((c, i) => {
          const row = document.createElement('div');
          row.style.margin = '.55rem 0';
          const label = document.createElement('div');
          label.className = 'small';
          label.style.marginBottom = '.3rem';
          label.innerHTML = '<strong>' + String.fromCharCode(65 + i) + '</strong> · ' + c + ' Stimme(n)' + (i === data.correctIndex ? ' ✅' : '');
          if (i === data.correctIndex) label.style.color = 'var(--good)';
          const bar = document.createElement('div');
          bar.style.height = '10px';
          bar.style.borderRadius = '999px';
          bar.style.transition = 'width .6s cubic-bezier(.22,1,.36,1)';
          bar.style.background = i === data.correctIndex
            ? 'linear-gradient(90deg, var(--good), #10b981)'
            : 'linear-gradient(90deg, rgba(255,255,255,.18), rgba(255,255,255,.08))';
          bar.style.width = Math.round((c / max) * 100) + '%';
          bar.style.boxShadow = i === data.correctIndex ? '0 0 12px rgba(52, 211, 153, .5)' : 'none';
          row.appendChild(label); row.appendChild(bar);
          body.appendChild(row);
        });
      }

      renderBoard($('reviewBoard'), data.leaderboard);
      $('nextBtn').textContent = data.hasNext ? 'Nächste Frage' : 'Endstand zeigen';
    });

    $('nextBtn').onclick = () => {
      socket.emit('host:next', {}, (resp) => { if (resp && resp.error) alert(resp.error); });
    };

    socket.on('game:end', (data) => {
      show('endCard');
      renderBoard($('finalBoard'), data.leaderboard);
    });

    socket.on('game:cancelled', (data) => {
      $('cancelBanner').textContent = data.reason || 'Spiel beendet';
      $('cancelBanner').hidden = false;
    });

    socket.on('disconnect', () => {
      $('cancelBanner').textContent = 'Verbindung verloren. Bitte Seite neu laden.';
      $('cancelBanner').hidden = false;
    });

    function renderBoard(table, board) {
      table.innerHTML = '<thead><tr><th>#</th><th>Spieler</th><th class="score">Punkte</th></tr></thead>';
      const tbody = document.createElement('tbody');
      board.forEach((p, i) => {
        const tr = document.createElement('tr');
        const label = (p.avatar ? p.avatar + ' ' : '') + escapeHtml(p.name);
        tr.innerHTML = '<td class="rank">' + (i + 1) + '</td><td>' + label + '</td><td class="score">' + p.score + '</td>';
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
    }

    function runTimer(deadline, total) {
      if (currentTimer) clearInterval(currentTimer);
      const bar = $('timerBar');
      function tick() {
        const left = Math.max(0, deadline - Date.now());
        bar.style.width = (left / (total * 1000) * 100) + '%';
        if (left <= 0) clearInterval(currentTimer);
      }
      tick();
      currentTimer = setInterval(tick, 250);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
  </script>
</body>
</html>
