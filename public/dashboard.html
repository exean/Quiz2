<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz · Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <script src="/bg.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="card flex-between">
      <div>
        <h1>Meine Quizzes</h1>
        <p class="muted small" id="userInfo"></p>
      </div>
      <button id="logoutBtn" class="secondary">Abmelden</button>
    </div>

    <div class="card">
      <h2>Neues Quiz</h2>
      <label for="newName">Name</label>
      <input id="newName" type="text" maxlength="80" placeholder="z.B. Geografie-Quiz" />
      <label for="newDesc">Beschreibung</label>
      <input id="newDesc" type="text" maxlength="500" placeholder="Kurze Beschreibung (optional)" />
      <div class="spaced"><button id="createBtn">Quiz anlegen</button></div>
      <div id="createMsg" class="small spaced"></div>
    </div>

    <div class="card">
      <h2>Quizzes</h2>
      <div id="quizList"><p class="muted small">Lade ...</p></div>
    </div>

    <div class="card">
      <h2>🔑 Passkeys</h2>
      <p class="muted small">Mit einem Passkey kannst du dich ohne Passwort einloggen (z. B. per Fingerabdruck, Face ID, Windows Hello).</p>
      <div id="passkeyList"></div>
      <div class="spaced"><button id="addPasskeyBtn">Passkey hinzufügen</button></div>
      <div id="passkeyMsg" class="small spaced"></div>
    </div>
  </div>

  <script src="/webauthn.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        ...opts,
        credentials: 'include',
        headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
      });
      if (res.status === 401) { location.href = '/login.html'; throw new Error('unauth'); }
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || ('HTTP ' + res.status));
      }
      return res.status === 204 ? null : res.json();
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    let currentMe = null;
    async function loadMe() {
      const data = await api('/api/auth/me');
      if (!data.user) { location.href = '/login.html'; return; }
      currentMe = data.user.id;
      $('userInfo').textContent = 'Eingeloggt als ' + data.user.email;
    }

    async function loadQuizzes() {
      const list = await api('/api/quizzes');
      const target = $('quizList');
      target.innerHTML = '';
      if (!list.length) {
        target.innerHTML = '<p class="muted">Noch keine Quizzes. Lege oben dein erstes an.</p>';
        return;
      }
      list.forEach((q) => {
        const div = document.createElement('div');
        div.className = 'list-item';
        const playable = q.totalQuestions > 0 && q.canHost;
        const roleBadge = q.role === 'owner'
          ? '<span class="badge badge-owner">Ersteller</span>'
          : '<span class="badge badge-member">Mitwirkende:r</span>';
        const countText = (q.role === 'member' && q.ownQuestions !== q.totalQuestions)
          ? q.ownQuestions + ' eigene · ' + q.totalQuestions + ' gesamt'
          : q.totalQuestions + ' Frage' + (q.totalQuestions === 1 ? '' : 'n');
        const playBtn = q.canHost
          ? '<a class="btn" href="/host.html?quiz=' + encodeURIComponent(q.id) + '" ' + (playable ? '' : 'style="opacity:.4;pointer-events:none"') + '>Spielen</a>'
          : '';
        const deleteBtn = q.role === 'owner'
          ? '<button class="danger" data-del="' + q.id + '">Löschen</button>'
          : '<button class="secondary" data-leave="' + q.id + '">Verlassen</button>';
        div.innerHTML =
          '<div class="list-item-info">' +
            '<div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.2rem">' +
              '<strong>' + escapeHtml(q.name) + '</strong>' + roleBadge +
            '</div>' +
            '<div class="muted small">' + countText + '</div>' +
            (q.description ? '<div class="muted small">' + escapeHtml(q.description) + '</div>' : '') +
          '</div>' +
          '<div class="list-item-actions">' +
            playBtn +
            '<a class="btn secondary" href="/quiz-edit.html?id=' + encodeURIComponent(q.id) + '">' + (q.role === 'owner' ? 'Bearbeiten' : 'Öffnen') + '</a>' +
            deleteBtn +
          '</div>';
        target.appendChild(div);
      });
      target.querySelectorAll('button[data-del]').forEach((b) => {
        b.onclick = async () => {
          if (!confirm('Quiz wirklich löschen?')) return;
          await api('/api/quizzes/' + encodeURIComponent(b.dataset.del), { method: 'DELETE' });
          loadQuizzes();
        };
      });
      target.querySelectorAll('button[data-leave]').forEach((b) => {
        b.onclick = async () => {
          if (!confirm('Quiz wirklich verlassen?')) return;
          try {
            await api('/api/quizzes/' + encodeURIComponent(b.dataset.leave) + '/members/' + encodeURIComponent(currentMe), { method: 'DELETE' });
          } catch (err) { alert(err.message); }
          loadQuizzes();
        };
      });
    }

    async function loadPasskeys() {
      const list = await api('/api/webauthn/credentials');
      const target = $('passkeyList');
      target.innerHTML = '';
      if (!list.length) {
        target.innerHTML = '<p class="muted small">Noch keine Passkeys hinterlegt.</p>';
        return;
      }
      list.forEach((c) => {
        const div = document.createElement('div');
        div.className = 'list-item';
        const info = document.createElement('div');
        info.className = 'list-item-info';
        info.innerHTML = escapeHtml(c.label) + ' <span class="muted small">(' + new Date(c.createdAt).toLocaleDateString() + ')</span>';
        const actions = document.createElement('div');
        actions.className = 'list-item-actions';
        const del = document.createElement('button');
        del.className = 'danger';
        del.textContent = 'Entfernen';
        del.onclick = async () => {
          if (!confirm('Passkey wirklich entfernen?')) return;
          await api('/api/webauthn/credentials/' + encodeURIComponent(c.id), { method: 'DELETE' });
          loadPasskeys();
        };
        actions.appendChild(del);
        div.appendChild(info);
        div.appendChild(actions);
        target.appendChild(div);
      });
    }

    $('createBtn').onclick = async () => {
      const name = $('newName').value.trim();
      const description = $('newDesc').value.trim();
      const msg = $('createMsg');
      msg.textContent = '';
      if (!name) { msg.className = 'banner-bad small spaced'; msg.textContent = 'Name fehlt'; return; }
      try {
        await api('/api/quizzes', { method: 'POST', body: JSON.stringify({ name, description }) });
        $('newName').value = ''; $('newDesc').value = '';
        msg.className = 'banner-good small spaced';
        msg.textContent = 'Quiz angelegt.';
        loadQuizzes();
      } catch (err) {
        msg.className = 'banner-bad small spaced';
        msg.textContent = err.message;
      }
    };

    $('logoutBtn').onclick = async () => {
      await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
      location.href = '/';
    };

    $('addPasskeyBtn').onclick = async () => {
      const msg = $('passkeyMsg');
      msg.textContent = '';
      if (!window.webauthnSupported()) {
        msg.className = 'banner-bad small spaced';
        msg.textContent = 'Dieser Browser unterstützt keine Passkeys.';
        return;
      }
      try {
        await window.webauthnRegister();
        msg.className = 'banner-good small spaced';
        msg.textContent = 'Passkey gespeichert.';
        loadPasskeys();
      } catch (err) {
        msg.className = 'banner-bad small spaced';
        msg.textContent = 'Fehlgeschlagen: ' + err.message;
      }
    };

    loadMe().then(() => { loadQuizzes(); loadPasskeys(); });
  </script>
</body>
</html>
