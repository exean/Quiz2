<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz · Neues Passwort</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <script src="/bg.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="card flex-between">
      <h1>Neues Passwort</h1>
      <a class="btn secondary" href="/login.html">Zurück</a>
    </div>

    <div class="card" id="formCard">
      <p class="muted small">Setze ein neues Passwort für deinen Account.</p>
      <label for="password">Neues Passwort (min. 8 Zeichen)</label>
      <input id="password" type="password" autocomplete="new-password" />
      <label for="password2">Wiederholen</label>
      <input id="password2" type="password" autocomplete="new-password" />
      <div class="spaced"><button id="submitBtn">Passwort setzen</button></div>
      <div id="msg" class="small spaced"></div>
    </div>

    <div class="card banner-bad" id="noTokenCard" hidden>
      Kein Reset-Token im Link. Bitte erneut über <a href="/forgot-password.html">„Passwort vergessen"</a> anfordern.
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const token = new URLSearchParams(location.search).get('token');
    if (!token) {
      $('formCard').hidden = true;
      $('noTokenCard').hidden = false;
    }
    function showMsg(text, kind) {
      const el = $('msg');
      el.className = (kind === 'good' ? 'banner-good' : 'banner-bad') + ' small spaced';
      el.textContent = text;
    }
    async function send() {
      const p1 = $('password').value;
      const p2 = $('password2').value;
      if (p1.length < 8) return showMsg('Mindestens 8 Zeichen', 'bad');
      if (p1 !== p2) return showMsg('Passwörter stimmen nicht überein', 'bad');
      const res = await fetch('/api/auth/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: p1 }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) return showMsg(body.error || 'Fehler', 'bad');
      showMsg('Passwort gesetzt. Du wirst zum Login geleitet ...', 'good');
      setTimeout(() => { location.href = '/login.html'; }, 800);
    }
    $('submitBtn').onclick = send;
    $('password2').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
  </script>
</body>
</html>
