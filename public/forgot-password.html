<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz · Passwort vergessen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <script src="/bg.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="card flex-between">
      <h1>Passwort zurücksetzen</h1>
      <a class="btn secondary" href="/login.html">Zurück</a>
    </div>

    <div class="card">
      <p class="muted small">Gib deine E-Mail-Adresse ein. Wir schicken dir einen Link, mit dem du ein neues Passwort setzen kannst.</p>
      <label for="email">E-Mail</label>
      <input id="email" type="email" autocomplete="username" />
      <div class="spaced"><button id="submitBtn">Link senden</button></div>
      <div id="msg" class="small spaced"></div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    function showMsg(text, kind, link) {
      const el = $('msg');
      el.className = (kind === 'good' ? 'banner-good' : 'banner-bad') + ' small spaced';
      el.innerHTML = '';
      el.appendChild(document.createTextNode(text));
      if (link) {
        el.appendChild(document.createElement('br'));
        const a = document.createElement('a');
        a.href = link; a.textContent = link;
        el.appendChild(a);
      }
    }
    async function send() {
      const email = $('email').value.trim();
      if (!email) return showMsg('Bitte E-Mail eingeben', 'bad');
      const res = await fetch('/api/auth/forgot', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      const body = await res.json().catch(() => ({}));
      if (body.devLink) {
        showMsg('SMTP nicht konfiguriert – nutze diesen Link:', 'good', body.devLink);
      } else {
        showMsg('Falls ein Account mit dieser E-Mail existiert, wurde ein Link verschickt.', 'good');
      }
    }
    $('submitBtn').onclick = send;
    $('email').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
  </script>
</body>
</html>
