<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz · Admin</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="container">
    <div class="card flex-between">
      <h1>Fragen verwalten</h1>
      <a class="btn secondary" href="/">Zurück</a>
    </div>

    <div class="card" id="loginCard">
      <h2>Admin-Login</h2>
      <p class="muted small">Standard-Passwort ist <code>admin</code> (über Umgebungsvariable <code>ADMIN_PASSWORD</code> änderbar).</p>
      <label for="pw">Passwort</label>
      <input id="pw" type="password" autocomplete="current-password" />
      <div class="spaced"><button id="loginBtn">Anmelden</button></div>
      <div id="loginError" class="banner-bad small spaced" hidden></div>
    </div>

    <div id="appCard" hidden>
      <div class="card">
        <h2>Neue Frage</h2>
        <label for="qText">Frage</label>
        <input id="qText" type="text" placeholder="z.B. Was ist die Hauptstadt der Schweiz?" />

        <div id="answersList"></div>

        <div class="row spaced">
          <button id="addAnswerBtn" class="secondary" type="button">+ Antwort</button>
          <button id="removeAnswerBtn" class="secondary" type="button">– Antwort</button>
        </div>

        <label for="qTime" class="spaced">Zeitlimit (Sekunden)</label>
        <input id="qTime" type="number" value="20" min="5" max="120" />

        <div class="spaced">
          <button id="saveBtn">Frage speichern</button>
        </div>
        <div id="formMsg" class="small spaced"></div>
      </div>

      <div class="card">
        <h2>Bestehende Fragen</h2>
        <div id="questionList"></div>
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let password = '';
    let answerCount = 0;

    function renderAnswers() {
      const list = $('answersList');
      list.innerHTML = '';
      for (let i = 0; i < answerCount; i++) {
        const wrap = document.createElement('div');
        wrap.style.marginTop = '.5rem';
        const lab = document.createElement('label');
        lab.textContent = 'Antwort ' + (i + 1);
        const row = document.createElement('div');
        row.className = 'row';
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.dataset.idx = i;
        inp.className = 'answer-input';
        inp.placeholder = 'Antworttext';
        const radioWrap = document.createElement('label');
        radioWrap.style.flex = '0 0 auto';
        radioWrap.style.alignSelf = 'center';
        radioWrap.style.margin = '0';
        radioWrap.style.color = 'var(--text)';
        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = 'correct';
        radio.value = i;
        if (i === 0) radio.checked = true;
        radioWrap.appendChild(radio);
        radioWrap.appendChild(document.createTextNode(' richtig'));
        row.appendChild(inp);
        row.appendChild(radioWrap);
        wrap.appendChild(lab);
        wrap.appendChild(row);
        list.appendChild(wrap);
      }
    }

    function setAnswerCount(n) {
      const prev = Array.from(document.querySelectorAll('.answer-input')).map((i) => i.value);
      const correct = Number((document.querySelector('input[name="correct"]:checked') || {}).value || 0);
      answerCount = Math.max(2, Math.min(6, n));
      renderAnswers();
      Array.from(document.querySelectorAll('.answer-input')).forEach((i, idx) => {
        if (prev[idx] !== undefined) i.value = prev[idx];
      });
      const radio = document.querySelector('input[name="correct"][value="' + Math.min(correct, answerCount - 1) + '"]');
      if (radio) radio.checked = true;
    }

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        ...opts,
        headers: {
          'Content-Type': 'application/json',
          'X-Admin-Password': password,
          ...(opts.headers || {}),
        },
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || ('HTTP ' + res.status));
      }
      return res.json();
    }

    async function loadList() {
      const list = await api('/api/questions');
      const target = $('questionList');
      if (!list.length) {
        target.innerHTML = '<p class="muted">Noch keine Fragen vorhanden.</p>';
        return;
      }
      target.innerHTML = '';
      list.forEach((q, idx) => {
        const div = document.createElement('div');
        div.style.borderBottom = '1px solid #334155';
        div.style.padding = '.6rem 0';
        const top = document.createElement('div');
        top.className = 'flex-between';
        const title = document.createElement('div');
        title.innerHTML = '<strong>' + (idx + 1) + '. ' + escapeHtml(q.text) + '</strong> <span class="muted small">(' + q.timeLimit + 's)</span>';
        const del = document.createElement('button');
        del.textContent = 'Löschen';
        del.className = 'danger';
        del.onclick = async () => {
          if (!confirm('Frage wirklich löschen?')) return;
          await api('/api/questions/' + encodeURIComponent(q.id), { method: 'DELETE' });
          loadList();
        };
        top.appendChild(title);
        top.appendChild(del);
        div.appendChild(top);

        const ul = document.createElement('ul');
        ul.style.margin = '.4rem 0 0 1.2rem';
        q.answers.forEach((a, i) => {
          const li = document.createElement('li');
          li.textContent = a;
          if (i === q.correctIndex) {
            li.style.color = 'var(--good)';
            li.style.fontWeight = '600';
          }
          ul.appendChild(li);
        });
        div.appendChild(ul);
        target.appendChild(div);
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    $('loginBtn').onclick = async () => {
      password = $('pw').value;
      try {
        await api('/api/questions');
        $('loginCard').hidden = true;
        $('appCard').hidden = false;
        setAnswerCount(4);
        loadList();
      } catch (err) {
        $('loginError').textContent = err.message;
        $('loginError').hidden = false;
      }
    };
    $('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });

    $('addAnswerBtn').onclick = () => setAnswerCount(answerCount + 1);
    $('removeAnswerBtn').onclick = () => setAnswerCount(answerCount - 1);

    $('saveBtn').onclick = async () => {
      const msg = $('formMsg');
      msg.textContent = '';
      const text = $('qText').value.trim();
      const answers = Array.from(document.querySelectorAll('.answer-input')).map((i) => i.value.trim());
      const correctIndex = Number((document.querySelector('input[name="correct"]:checked') || {}).value || 0);
      const timeLimit = Number($('qTime').value) || 20;
      try {
        await api('/api/questions', {
          method: 'POST',
          body: JSON.stringify({ text, answers, correctIndex, timeLimit }),
        });
        $('qText').value = '';
        document.querySelectorAll('.answer-input').forEach((i) => (i.value = ''));
        msg.className = 'banner-good small';
        msg.textContent = 'Frage gespeichert.';
        loadList();
      } catch (err) {
        msg.className = 'banner-bad small';
        msg.textContent = err.message;
      }
    };
  </script>
</body>
</html>
