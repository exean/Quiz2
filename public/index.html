<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Quiz</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="container">
    <div class="card center">
      <h1>Quiz</h1>
      <p class="muted">Mehrspieler-Quiz mit synchronisierten Fragen</p>
    </div>

    <div class="card">
      <h2>Mitspielen</h2>
      <p class="muted small">Du hast eine Game-PIN bekommen?</p>
      <a class="btn" href="/play.html">Spiel beitreten</a>
    </div>

    <div class="card">
      <h2>Spiel leiten</h2>
      <p class="muted small">Erstelle ein Spiel und teile die PIN mit deinen Freunden.</p>
      <a class="btn" href="/host.html">Neues Spiel starten</a>
    </div>

    <div class="card">
      <h2>Fragen verwalten</h2>
      <p class="muted small">Multiple-Choice-Fragen anlegen oder löschen.</p>
      <a class="btn secondary" href="/admin.html">Zum Admin-Bereich</a>
    </div>
  </div>
</body>
</html>
